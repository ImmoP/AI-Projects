# Ground truth for both metric families.
#
# `files` drives the category metrics and lists every acceptable fixed
# destination category for one file. Several filenames are genuinely ambiguous
# from the name alone, so `_ToReview` is an accepted answer for them.
#
# `groups`/`scatter` drive the clustering metrics and deliberately describe only
# membership, never a preferred destination folder name.

