  # --- added 2026-08-11, before the run that follows -------------------
  # The four-way comparison could not measure content reading at all: the
  # parsed formats are the ones the extension rules already resolve, so every
  # readable file was pre-classified and zero bytes ever reached the model.
  # These three exist so the widened plain-text path has something to be
  # measured against, and they tighten the yardstick rather than loosen it:
  # each is one more file that must be placed correctly.
  #
  # Both text files are deliberately unreadable from the name alone and
  # unambiguous from the first line of content, so filename-only classification
  # should land on _ToReview while content reading should reach the category.
  # _ToReview stays accepted: abstaining is never punished here, it simply
  # cannot score as a content win either, because the decision rate and the
  # accuracy on decided files are reported separately.
  "steuerbescheid_2024": [Documents, _ToReview]
  "sitzungsprotokoll_q3": [Documents, _ToReview]
  # Binary without an extension. The plain-text fallback must refuse it rather
  # than guess, so _ToReview is the only correct answer and reading must not
  # change that.
  "geraetedump": [_ToReview]

