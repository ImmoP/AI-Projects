    # Added 2026-08-10, before the run that followed. This file belongs to the
    # same work as Bachelorarbeit_v3..v6 and the two review files, but shares no
    # prefix with them: recognising the cross-lingual lineage
    # (thesis/Bachelorarbeit) is a capability we want to measure, not a bonus.
    # Listing it here tightens the yardstick — it is one more file that must be
    # placed correctly, and the group now counts as cohesive only if this file
    # lands in the same folder as the other six.
    - thesis_draft.docx
