[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy-agent"
version = "0.1.0"
description = "A safety-first, human-approved directory tidier"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "PyYAML>=6,<7",
    "python-dotenv>=1.1,<2",
    "smolagents[litellm]>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
tidy = "tidy.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tidy = ["config/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: fast end-to-end pipeline checks (does it run?)",
    "slow: tests that take more than ~2s",
]
