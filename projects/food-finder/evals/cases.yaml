cases:
  - id: de_frankfurt_italian
    prompt: "Finde mir die fünf besten italienischen Restaurants in Frankfurt am Main."
    tool_needed: true
    expected_tool: search_restaurants
    expected_arguments:
      city: "Frankfurt am Main"
      cuisine: "italienisch"

  - id: en_berlin_japanese
    prompt: "Find highly rated Japanese restaurants in Berlin."
    tool_needed: true
    expected_tool: search_restaurants
    expected_arguments:
      city: "Berlin"
      cuisine: "Japanese"

  - id: de_munich_vietnamese_thresholds
    prompt: "Suche vietnamesische Restaurants in München mit mindestens 4,3 Sternen und 80 Bewertungen."
    tool_needed: true
    expected_tool: search_restaurants
    expected_arguments:
      city: "München"
      cuisine: "vietnamesisch"
      min_rating: 4.3
      min_reviews: 80

