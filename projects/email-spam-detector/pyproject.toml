[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-detector-email"
version = "0.1.0"
description = "Email spam dataset preparation and inspection tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "beautifulsoup4",
    "scikit-learn",
    "joblib",
    "numpy",
    "requests",
    "tensorflow",
    "tiktoken",
    "tldextract",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "smoke: fast end-to-end pipeline checks (does it run?)",
    "slow: tests that take more than ~2s",
]
